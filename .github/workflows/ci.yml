name: DevSecOps 9+ Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Verify Primary Manifest
        run: |
          test -f fluent-bit.conf
          echo "Manifest verified: fluent-bit.conf"

      - name: Run SRE Governance Verification
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh
